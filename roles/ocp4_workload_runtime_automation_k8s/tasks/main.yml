---
- name: Running ocp4_workload_runtime_automation_k8s provision tasks
  when: ACTION | default('provision') in ['provision', 'create']
  ansible.builtin.include_tasks: workload.yml

- name: Running ocp4_workload_runtime_automation_k8s removal tasks
  # Namespace destroy (config: namespace) passes ACTION=remove;
  # cluster / openshift-workloads destroy passes ACTION=destroy.
  when: ACTION | default('provision') in ['remove', 'destroy']
  ansible.builtin.include_tasks: remove_workload.yml
